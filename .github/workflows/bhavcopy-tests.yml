name: NSE Bhavcopy integration tests

on:
  push:
    branches: [feature/nse-bhavcopy-integration]
    paths:
      - "nse_bhavcopy/**"
      - "tests/test_bhavcopy.py"
      - "app.py"
      - ".github/workflows/bhavcopy-tests.yml"
  pull_request:
    paths:
      - "nse_bhavcopy/**"
      - "tests/test_bhavcopy.py"
      - ".github/workflows/bhavcopy-tests.yml"

jobs:
  isolated-bhavcopy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile isolated integration package
        run: python -m compileall -q app.py nse_bhavcopy tests/test_bhavcopy.py
      - name: Run fixture-based integration tests
        run: python -m unittest discover -s tests -p "test_bhavcopy.py" -v
