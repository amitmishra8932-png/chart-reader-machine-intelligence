name: Python engine tests
on:
  push:
    branches: [main, phase-8-2a-leakage-safe-outcomes, phase-8-2b-pattern-registry-reconciliation, phase-8-2c-detector-boundary-isolation, phase-8-3-causal-feature-engineering, phase-8-4-validation-and-closed-bar-context, phase-8-5-leakage-safe-ml-targets, phase-8-6-baseline-ml-evaluation, phase-8-7-feature-ablation-robustness, phase-8-8-neutral-band-sensitivity]
  pull_request:
    branches: [main, phase-8-2a-leakage-safe-outcomes, phase-8-2b-pattern-registry-reconciliation, phase-8-2c-detector-boundary-isolation, phase-8-3-causal-feature-engineering, phase-8-4-validation-and-closed-bar-context, phase-8-5-leakage-safe-ml-targets, phase-8-6-baseline-ml-evaluation, phase-8-7-feature-ablation-robustness, phase-8-8-neutral-band-sensitivity]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py engine providers data scripts
      - run: python -m unittest discover -s tests -v
